name: Worker deploy (Hetzner)

# Build de la imagen Docker del worker, push a GHCR y despliegue en Hetzner.
# Se ejecuta al hacer push a `main` cuando cambia el worker o el código compartido.
#
# Secretos requeridos (Settings → Secrets → Actions):
#   HETZNER_HOST         host/IP del VPS
#   HETZNER_USER         usuario SSH
#   HETZNER_SSH_KEY      clave privada SSH
#   HETZNER_WORKER_DIR   ruta en el VPS con docker-compose.worker.yml + .env.worker
#   GHCR_PAT             token con read:packages para que el VPS haga pull de GHCR
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "docker-compose.worker.yml"
      - ".github/workflows/worker-deploy.yml"
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck worker
        run: npx tsc --noEmit -p worker/tsconfig.json

  build-and-push:
    needs: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/crt-lineas-worker" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: WORKER_IMAGE
          script: |
            set -e
            export WORKER_IMAGE="${{ needs.build-and-push.outputs.image }}:latest"
            cd "${{ secrets.HETZNER_WORKER_DIR }}"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.worker.yml pull
            docker compose -f docker-compose.worker.yml up -d
            docker image prune -f
